<div id="friendProfileModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; align-items:center; justify-content:center;">
  <div style="background:#1e1e1e; padding:25px; border-radius:16px; max-width:360px; width:90%; text-align:center; position:relative;">
    <span onclick="closeFriendModal()" style="position:absolute; top:10px; right:15px; font-size:30px; cursor:pointer; color:#aaa;">×</span>
    
    <img id="modalFriendAvatar" 
         style="width:160px; height:160px; border-radius:50%; object-fit:cover; border:4px solid #00ff9d; margin-bottom:15px;" 
         src="/uploads/avatars/default.png" alt="Avatar">
    
    <h2 id="modalFriendName" style="margin:8px 0 4px 0; color:white;"></h2>
    <p id="modalFriendUsername" style="color:#aaa; margin:0 0 15px 0;"></p>
    
    <button onclick="closeFriendModal()" style="margin-top:20px; padding:10px 24px; background:#333; color:white; border:none; border-radius:8px; cursor:pointer;">
      Fechar
    </button>
  </div>
</div>
