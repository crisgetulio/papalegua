<!DOCTYPE html>
<html>
<head><title>Upload APK</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px">
<h2>📦 Upload APK</h2>
<form action="/api/upload-apk" method="post" enctype="multipart/form-data">
    <input type="file" name="apk" accept=".apk"><br><br>
    <input type="text" name="version" placeholder="Versão (ex: 1.0.1)"><br><br>
    <input type="number" name="versionCode" placeholder="Código da versão (ex: 2)"><br><br>
    <textarea name="releaseNotes" placeholder="Notas de lançamento"></textarea><br><br>
    <label><input type="checkbox" name="forceUpdate" value="true"> Forçar atualização</label><br><br>
    <button type="submit">Enviar APK</button>
</form>
</body>
</html>
