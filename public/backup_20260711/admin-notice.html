<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Recado</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0d1117;font-family:'Segoe UI',Roboto,system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .card{background:#111827;border-radius:16px;padding:24px;max-width:500px;width:100%;border:1px solid #1e293b}
        h1{color:#f1f5f9;font-size:20px;margin-bottom:16px;text-align:center}
        label{color:#94a3b8;font-size:13px;display:block;margin-bottom:4px}
        textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #1e293b;background:#0d1117;color:#f1f5f9;font-size:14px;resize:vertical;min-height:80px;margin-bottom:12px}
        input[type="password"]{width:100%;padding:10px;border-radius:8px;border:1px solid #1e293b;background:#0d1117;color:#f1f5f9;margin-bottom:12px}
        .checkbox-group{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:#94a3b8}
        .checkbox-group input[type="checkbox"]{width:18px;height:18px;accent-color:#d4af37}
        button{background:#d4af37;color:#111827;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;font-size:16px}
        button:hover{background:#e5c44d}
        .message{padding:10px;border-radius:8px;margin-top:12px;display:none}
        .message.success{background:#dcfce7;color:#166534;display:block}
        .message.error{background:#fee2e2;color:#991b1b;display:block}
        .current-notice{background:#1a2332;padding:12px;border-radius:8px;margin-bottom:16px;color:#94a3b8;font-size:14px;border-left:3px solid #d4af37}
        .current-notice strong{color:#f1f5f9}
        .status-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
        .status-badge.active{background:#22c55e20;color:#22c55e}
        .status-badge.inactive{background:#47556920;color:#94a3b8}
        a{color:#d4af37;text-decoration:none;display:block;text-align:center;margin-top:12px}
    </style>
</head>
<body>
<div class="card">
    <h1>📢 Gerenciar Recado</h1>
    <div class="current-notice" id="currentNotice">
        <div><strong>Recado atual:</strong> <span id="currentText">Nenhum</span></div>
        <div style="margin-top:4px;font-size:12px;">
            Status: <span class="status-badge inactive" id="currentStatus">Inativo</span>
            <span id="currentUpdated" style="margin-left:8px;"></span>
        </div>
    </div>
    <div id="message" class="message"></div>
    <form id="noticeForm">
        <label for="noticeText">Mensagem (máx 500 caracteres)</label>
        <textarea id="noticeText" placeholder="Digite o recado para todos os usuários..."></textarea>
        <div class="checkbox-group">
            <input type="checkbox" id="noticeActive">
            <label for="noticeActive" style="margin:0;cursor:pointer">Ativo (exibir para todos)</label>
        </div>
        <label for="adminPassword">Senha de administrador</label>
        <input type="password" id="adminPassword" placeholder="Digite a senha admin" autocomplete="current-password">
        <button type="submit">Salvar Recado</button>
    </form>
    <a href="/contacts.html">← Voltar para o app</a>
</div>
<script>
    async function loadNotice() {
        try {
            const res = await fetch('/api/notice');
            const data = await res.json();
            document.getElementById('currentText').textContent = data.text || 'Nenhum';
            const statusEl = document.getElementById('currentStatus');
            if (data.active) {
                statusEl.textContent = 'Ativo';
                statusEl.className = 'status-badge active';
            } else {
                statusEl.textContent = 'Inativo';
                statusEl.className = 'status-badge inactive';
            }
            document.getElementById('currentUpdated').textContent = data.updatedAt ? `Atualizado em: ${new Date(data.updatedAt).toLocaleString()}` : '';
            document.getElementById('noticeText').value = data.text || '';
            document.getElementById('noticeActive').checked = data.active || false;
        } catch(e) { console.error(e); }
    }

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = document.getElementById('noticeText').value.trim();
        const active = document.getElementById('noticeActive').checked;
        const password = document.getElementById('adminPassword').value;
        if (!password) {
            showMessage('Digite a senha de administrador', 'error');
            return;
        }
        try {
            const res = await fetch('/api/admin/notice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, active, password })
            });
            const data = await res.json();
            if (res.ok) {
                showMessage('Recado salvo com sucesso!', 'success');
                loadNotice();
            } else {
                showMessage(data.error || 'Erro ao salvar', 'error');
            }
        } catch(e) {
            showMessage('Erro de conexão', 'error');
        }
    });

    function showMessage(msg, type) {
        const el = document.getElementById('message');
        el.textContent = msg;
        el.className = `message ${type}`;
        setTimeout(() => { el.style.display = 'none'; el.className = 'message'; }, 4000);
    }

    loadNotice();
</script>
</body>
</html>
