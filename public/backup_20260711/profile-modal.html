<div id="friendProfileModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close-btn" onclick="closeFriendModal()">×</span>
    
    <div class="profile-header">
      <img id="modalFriendAvatar" class="large-avatar" src="" alt="Avatar">
    </div>
    
    <div class="profile-info">
      <h2 id="modalFriendName"></h2>
      <p id="modalFriendUsername"></p>
      <p id="modalFriendBio" class="bio"></p>
      
      <div class="profile-stats">
        <div>Membro desde: <span id="modalMemberSince"></span></div>
        <div>Telefone: <span id="modalPhone"></span></div>
      </div>
    </div>
    
    <div class="modal-actions">
      <button onclick="startChatWithFriend()" class="btn-primary">Enviar Mensagem</button>
      <button onclick="closeFriendModal()" class="btn-secondary">Fechar</button>
    </div>
  </div>
</div>
