<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquivos · Papalegua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* (mesmo CSS de sempre, sem alterações de restrição) */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #F5F7FA;
    --surface:   #FFFFFF;
    --border:    #E4E8EF;
    --text:      #1A1D23;
    --muted:     #6B7280;
    --accent:    #4F7FFA;
    --accent-lt: #EEF3FF;
    --danger:    #EF4444;
    --success:   #22C55E;
    --radius:    14px;
    --shadow:    0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
  }
  body {
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-sep { width: 1px; height: 22px; background: var(--border); }
  .header-title { font-size: 15px; font-weight: 500; color: var(--muted); }
  .header-back {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 8px;
    transition: background .15s, color .15s;
  }
  .header-back:hover { background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .toolbar h1 {
    font-size: 20px;
    font-weight: 600;
    flex: 1;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 320px;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 8px 12px 8px 36px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 13px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-lt); }
  .view-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
  }
  .view-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 7px 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    transition: background .15s, color .15s;
  }
  .view-btn.active { background: var(--surface); color: var(--accent); }
  .view-btn:hover:not(.active) { color: var(--text); }
  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 150px;
  }
  .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: var(--accent-lt);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
  }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
  .stat-value { font-size: 18px; font-weight: 600; margin-top: 1px; }
  .chips {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background .15s, color .15s, border-color .15s;
    user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip-count {
    background: rgba(255,255,255,.25);
    border-radius: 99px;
    padding: 1px 6px;
    font-size: 11px;
  }
  .chip:not(.active) .chip-count { background: var(--bg); color: var(--muted); }
  #files-container.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  #files-container.list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .file-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
  }
  .file-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,.1); }
  .thumb {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    background: var(--bg);
    display: block;
    border-bottom: 1px solid var(--border);
  }
  .thumb-icon {
    width: 100%;
    aspect-ratio: 16/10;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--border);
    font-size: 36px;
  }
  .player-audio {
    width: 100%;
    padding: 8px;
    background: #f8fafc;
  }
  .player-video {
    width: 100%;
    background: #000;
  }
  .card-body { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .card-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .card-meta { font-size: 11px; color: var(--muted); }
  .card-actions {
    display: flex;
    gap: 6px;
    padding: 8px 14px 12px;
  }
  .btn-dl, .btn-copy {
    flex: 1;
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--muted);
    text-decoration: none;
    transition: background .12s, color .12s, border-color .12s;
  }
  .btn-dl:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-copy:hover { background: var(--surface); color: var(--text); border-color: var(--text); }
  .btn-copy.copied { color: var(--success); border-color: var(--success); }
  .file-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow .15s, border-color .15s;
    flex-wrap: wrap;
  }
  .file-row:hover { box-shadow: var(--shadow); border-color: var(--accent); }
  .row-thumb {
    width: 44px;
    height: 44px;
    border-radius: 9px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    border: 1px solid var(--border);
  }
  .row-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row-info { flex: 1; min-width: 0; }
  .row-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row-badge {
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .3px;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-decoration: none;
    transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row-player {
    width: 100%;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    display: none;
  }
  .empty svg { opacity: .3; margin-bottom: 16px; }
  .empty p { font-size: 15px; font-weight: 500; }
  .empty small { font-size: 13px; opacity: .7; }
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1A1D23;
    color: #fff;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    white-space: nowrap;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 600px) {
    main { padding: 20px 14px 48px; }
    .stats { gap: 10px; }
    .stat-card { min-width: 130px; padding: 12px 14px; }
    #files-container.grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .toolbar { gap: 8px; }
    .search-wrap { max-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    Papalegua
  </a>
  <div class="header-sep"></div>
  <span class="header-title">Arquivos</span>
  <a class="header-back" href="/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar ao chat
  </a>
</header>
<main>
  <div class="toolbar">
    <h1>Arquivos enviados</h1>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Buscar arquivos…">
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="btn-grid" title="Grade" onclick="setView('grid')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button class="view-btn" id="btn-list" title="Lista" onclick="setView('list')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="stats" id="stats-bar">
    <div class="stat-card"><div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div><div><div class="stat-label">Total</div><div class="stat-value" id="stat-total">—</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#FFF1F1;color:#EF4444"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><div><div class="stat-label">Tamanho</div><div class="stat-value" id="stat-size">—</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#F0FDF4;color:#22C55E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div><div><div class="stat-label">Imagens</div><div class="stat-value" id="stat-img">—</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#FFFBEB;color:#F59E0B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div><div><div class="stat-label">Vídeos</div><div class="stat-value" id="stat-vid">—</div></div></div>
  </div>
  <div class="chips" id="filter-chips">
    <div class="chip active" data-filter="all" onclick="setFilter('all')">Todos <span class="chip-count" id="cnt-all">0</span></div>
    <div class="chip" data-filter="image" onclick="setFilter('image')">🖼 Imagens <span class="chip-count" id="cnt-image">0</span></div>
    <div class="chip" data-filter="video" onclick="setFilter('video')">🎬 Vídeos <span class="chip-count" id="cnt-video">0</span></div>
    <div class="chip" data-filter="audio" onclick="setFilter('audio')">🎵 Áudios <span class="chip-count" id="cnt-audio">0</span></div>
    <div class="chip" data-filter="pdf" onclick="setFilter('pdf')">📄 PDFs <span class="chip-count" id="cnt-pdf">0</span></div>
    <div class="chip" data-filter="doc" onclick="setFilter('doc')">📝 Docs <span class="chip-count" id="cnt-doc">0</span></div>
    <div class="chip" data-filter="other" onclick="setFilter('other')">📦 Outros <span class="chip-count" id="cnt-other">0</span></div>
  </div>
  <div id="files-container" class="grid"></div>
  <div class="empty" id="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    <p>Nenhum arquivo encontrado</p>
    <small>Tente outro filtro ou termo de busca</small>
  </div>
</main>
<div id="toast"></div>
<script>
const EXT_MAP = {
  image: ['jpg','jpeg','png','gif','webp','bmp','svg','ico','tiff','avif'],
  video: ['mp4','webm','avi','mov','mkv','flv','wmv','m4v'],
  audio: ['mp3','ogg','wav','flac','aac','m4a','webm','opus'],
  pdf:   ['pdf'],
  doc:   ['doc','docx','xls','xlsx','ppt','pptx','txt','csv','md','odt'],
  zip:   ['zip','rar','7z','tar','gz','bz2'],
  Aplicativos: ['exe', 'apk'],
  Imagens de disco: ['iso', 'img'],
};
function getType(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  for (const [type, exts] of Object.entries(EXT_MAP)) {
    if (exts.includes(ext)) return type;
  }
  return 'other';
}
const TYPE_ICONS = {
  image: '🖼', video: '🎬', audio: '🎵', pdf: '📄',
  doc: '📝', zip: '📦', iso: '📀' , apk: '📲',    exe: '💻' , other: '📁' 
};
const TYPE_LABELS = {
  image: 'Imagem', video: 'Vídeo', audio: 'Áudio', pdf: 'PDF',
  doc: 'Documento', zip: 'Arquivo', iso: 'Imagens ISO' , apk: 'Aplicativo' , exe: 'Programas' , other: 'Arquivo'
};
let allFiles = [];
let currentFilter = 'all';
let currentView   = 'grid';
let searchQuery   = '';

// Função para pausar todas as mídias (vídeos e áudios), exceto a que está iniciando
function pauseOtherMedia(currentMedia) {
  // Pausa todos os vídeos
  document.querySelectorAll('video').forEach(video => {
    if (video !== currentMedia && !video.paused) {
      video.pause();
    }
  });
  // Pausa todos os áudios
  document.querySelectorAll('audio').forEach(audio => {
    if (audio !== currentMedia && !audio.paused) {
      audio.pause();
    }
  });
}

function fmtSize(bytes) {
  if (bytes == null) return '?';
  if (bytes < 1024)       return bytes + ' B';
  if (bytes < 1048576)    return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
  return (bytes/1073741824).toFixed(2) + ' GB';
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
}
async function loadFiles() {
  try {
    const res = await fetch('/api/files');
    if (!res.ok) { console.error('Erro ao carregar arquivos'); return; }
    allFiles = await res.json();
    updateStats();
    updateCounts();
    render();
  } catch (e) { console.error(e); }
}
function updateStats() {
  const total = allFiles.length;
  const size  = allFiles.reduce((s, f) => s + (f.size || 0), 0);
  const imgs  = allFiles.filter(f => getType(f.name) === 'image').length;
  const vids  = allFiles.filter(f => getType(f.name) === 'video').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-size').textContent  = fmtSize(size);
  document.getElementById('stat-img').textContent   = imgs;
  document.getElementById('stat-vid').textContent   = vids;
}
function updateCounts() {
  const counts = { all: allFiles.length };
  for (const t of ['image','video','audio','pdf','doc','other']) {
    counts[t] = allFiles.filter(f => getType(f.name) === t).length;
  }
  for (const [k, v] of Object.entries(counts)) {
    const el = document.getElementById('cnt-' + k);
    if (el) el.textContent = v;
  }
}
function filtered() {
  return allFiles.filter(f => {
    const type = getType(f.name);
    const matchFilter = currentFilter === 'all' || type === currentFilter;
    const matchSearch = !searchQuery || f.name.toLowerCase().includes(searchQuery);
    return matchFilter && matchSearch;
  });
}
function render() {
  const container = document.getElementById('files-container');
  const empty     = document.getElementById('empty-state');
  const files = filtered();
  container.innerHTML = '';
  if (files.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  if (currentView === 'grid') {
    container.className = 'grid';
    files.forEach(f => container.appendChild(makeCard(f)));
  } else {
    container.className = 'list';
    files.forEach(f => container.appendChild(makeRow(f)));
  }
}
function makeCard(f) {
  const type = getType(f.name);
  const card = document.createElement('div');
  card.className = 'file-card';
  let mediaHtml = '';
  if (type === 'image') {
    mediaHtml = `<img class="thumb" src="${f.url}" alt="${f.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                 <div class="thumb-icon image" style="display:none">${TYPE_ICONS.image}</div>`;
  } else if (type === 'video') {
    mediaHtml = `<video class="thumb" src="${f.url}" preload="metadata" controls></video>`;
  } else if (type === 'audio') {
    mediaHtml = `<div class="thumb-icon audio">${TYPE_ICONS.audio}</div>
                 <div class="player-audio"><audio controls src="${f.url}" style="width:100%"></audio></div>`;
  } else {
    mediaHtml = `<div class="thumb-icon ${type}">${TYPE_ICONS[type] || TYPE_ICONS.other}</div>`;
  }
  card.innerHTML = `
    ${mediaHtml}
    <div class="card-body">
      <div class="card-name" title="${f.name}">${f.name}</div>
      <div class="card-meta">${fmtSize(f.size)} · ${fmtDate(f.modified)}</div>
    </div>
    <div class="card-actions">
      <a class="btn-dl" href="${f.url}" download="${f.name}">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Baixar
      </a>
      <button class="btn-copy" onclick="copyLink(event,'${f.url}',this)">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copiar
      </button>
    </div>`;

  // Adiciona evento de play para pausar outras mídias (vídeos e áudios)
  const videoElem = card.querySelector('video');
  if (videoElem) {
    videoElem.addEventListener('play', () => pauseOtherMedia(videoElem));
  }
  const audioElem = card.querySelector('audio');
  if (audioElem) {
    audioElem.addEventListener('play', () => pauseOtherMedia(audioElem));
  }
  return card;
}
function makeRow(f) {
  const type = getType(f.name);
  const row = document.createElement('div');
  row.className = 'file-row';
  let thumbHtml = '';
  if (type === 'image') {
    thumbHtml = `<img src="${f.url}" alt="${f.name}" loading="lazy" onerror="this.textContent='${TYPE_ICONS.image}';this.tagName!=='DIV'&&(this.outerHTML='<div style=font-size:22px>${TYPE_ICONS.image}</div>')">`;
  } else {
    thumbHtml = TYPE_ICONS[type] || TYPE_ICONS.other;
  }
  let playerHtml = '';
  if (type === 'audio') {
    playerHtml = `<div class="row-player"><audio controls src="${f.url}" style="width:100%"></audio></div>`;
  } else if (type === 'video') {
    playerHtml = `<div class="row-player"><video controls src="${f.url}" style="width:100%; max-height:200px"></video></div>`;
  }
  row.innerHTML = `
    <div class="row-thumb">${thumbHtml}</div>
    <div class="row-info">
      <div class="row-name" title="${f.name}">${f.name}</div>
      <div class="row-meta">${fmtSize(f.size)} · ${fmtDate(f.modified)}</div>
    </div>
    <span class="row-badge">${TYPE_LABELS[type]}</span>
    <div class="row-actions">
      <a class="icon-btn" href="${f.url}" download="${f.name}" title="Baixar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </a>
      <button class="icon-btn" title="Copiar link" onclick="copyLink(event,'${f.url}',this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    ${playerHtml}
  `;

  // Adiciona evento de play para pausar outras mídias (vídeos e áudios)
  const videoElem = row.querySelector('video');
  if (videoElem) {
    videoElem.addEventListener('play', () => pauseOtherMedia(videoElem));
  }
  const audioElem = row.querySelector('audio');
  if (audioElem) {
    audioElem.addEventListener('play', () => pauseOtherMedia(audioElem));
  }
  return row;
}
function setView(v) {
  currentView = v;
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
  render();
}
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  render();
}
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase();
  render();
});
function copyLink(e, url, btn) {
  e.preventDefault();
  const full = location.origin + url;
  navigator.clipboard.writeText(full).then(() => {
    showToast('Link copiado!');
    if (btn) { btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 1500); }
  });
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
loadFiles();
</script>
</body>
